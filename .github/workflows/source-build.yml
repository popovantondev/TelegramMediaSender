name: Source and build checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and build dependencies
        run: python -m pip install -e ".[build]"
      - name: Check Python sources
        run: python -m compileall -q src scripts
      - name: Run existing offline tests
        run: python -m unittest discover -s tests -v
      - name: Build application without launching it
        run: |
          test "$(uname -m)" = arm64
          python scripts/generate_icon.py
          python -m PyInstaller --noconfirm TelegramMediaSender.spec
