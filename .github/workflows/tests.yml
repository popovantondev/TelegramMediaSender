name: Local test suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests:
    # Native Apple Silicon matches the only supported release architecture.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install application and test dependencies
        run: python -m pip install -e .

      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Run offline acceptance checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/check_functional_readiness.py
