[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-media-sender"
version = "1.2.0"
description = "A macOS desktop app for sending media groups and weekly study materials to Telegram"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6==6.10.2", "Telethon==1.42.0"]

[project.optional-dependencies]
build = ["pyinstaller==6.19.0"]

[project.scripts]
telegram-media-sender = "telegram_media_sender.gui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telegram_media_sender = ["assets/*.svg"]
